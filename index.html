<style>
    body {
        font-family: "Noto Sans SC", sans-serif;
        background: #0b0b0b;
        color: #fff;
        margin: 0;
        padding: 20px;
    }
    h1 {
        text-align: center;
        margin-bottom: 24px;
        color: #ff9900;
    }
    .tabs {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px;
        margin: 20px 0;
    }
    .tab {
        padding: 10px 20px;
        background: #222;
        color: #aaa;
        cursor: pointer;
        border-radius: 20px;
        transition: 0.3s;
    }
    .tab.active {
        background: #ff6600;
        color: #fff;
    }
    .chart {
        max-width: 900px;
        margin: auto;
        position: relative;
        height: 540px; /* 稍微调高一点，防止高亮阴影溢出 */
    }
  .row {
    position: absolute;
    left: 0;
    width: 100%;
    background: #1a1a1a;
    padding: 12px 15px;
    border-radius: 6px;
    box-sizing: border-box;
    transition: transform 0.9s ease, opacity 0.9s ease;
    opacity: 1;
    margin-bottom: 14px; /* ✅ 增加行间距 */
}

    .name {
        font-size: 16px;
        margin-bottom: 6px;
        font-weight: bold;
    }
    .bar-bg {
        background: #2a2a2a;
        height: 28px;
        border-radius: 14px;
        overflow: hidden;
    }
    .bar {
        height: 100%;
        background: linear-gradient(90deg, #ff9500, #ff4400); /* 默认橙红色 */
        border-radius: 14px 0 0 14px;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        padding-right: 12px;
        font-size: 14px;
        font-weight: bold;
        transition: width 0.9s ease;
    }
    .info {
        display: flex;
        justify-content: space-between;
        font-size: 13px;
        color: #aaa;
        margin-top: 6px;
    }
    .value {
        color: #ff9900;
        font-weight: bold;
    }

    /* ====================================================== */
    /* 🌟 给阿嬷的情书 - 专属高亮样式 START */
    /* ====================================================== */
    .row-highlight {
        background: linear-gradient(90deg, #2a1a0a, #1a1a1a);
        box-shadow: 0 0 15px rgba(255, 180, 0, 0.6);
        border: 1px solid rgba(255, 180, 0, 0.5);
        animation: breath 2.5s ease-in-out infinite; /* 呼吸动画 */
        z-index: 10; /* 确保在最上层 */
    }

    /* 呼吸光效 */
    @keyframes breath {
        0%, 100% { box-shadow: 0 0 12px rgba(255, 180, 0, 0.4); }
        50%      { box-shadow: 0 0 25px rgba(255, 180, 0, 0.9); }
    }

    /* 金色皇冠名字 */
    .grandma-name::before {
        content: "";
    }
    .grandma-name {
        color: #ffd700 !important;
        font-size: 18px !important;
        text-shadow: 0 0 8px rgba(255, 215, 0, 0.7);
    }

    /* 独特的青蓝色进度条 */
    .bar-grandma {
        background: linear-gradient(90deg, #00eaff, #6a00ff) !important;
    }
    /* ====================================================== */
    /* 🌟 给阿嬷的情书 - 专属高亮样式 END */
    /* ====================================================== */
</style>
</head>

    ]
};

let rows = {};
let currentData = [];
let animating = false;

function init() {
    const chart = document.getElementById("chart");
    rawData.day1.forEach((m, i) => {
        const row = document.createElement("div");
        row.className = "row";
        row.id = "row-" + m.id;
        row.style.transform = `translateY(${i * ROW_HEIGHT}px)`;

        // 🌟 核心：如果是给阿嬷的情书，加上高亮类
        if (m.id === "grandma") {
            row.classList.add("row-highlight");
        }

        row.innerHTML = `
            <div class="name ${m.id === 'grandma' ? 'grandma-name' : ''}">${m.name}</div>
            <div class="bar-bg">
                <div class="bar ${m.id === 'grandma' ? 'bar-grandma' : ''}" style="width:${m.rate}%">${m.rate}%</div>
            </div>
            <div class="info">
                <span>票房：<span class="value">${m.box.toFixed(2)}万</span></span>
                <span>排片：${m.sched}%</span>
                <span>数据比：${m.occ}%</span>
            </div>`;
        chart.appendChild(row);
        rows[m.id] = row;
    });
    currentData = JSON.parse(JSON.stringify(rawData.day1));
}

function animateTo(targetDay) {
    if (animating) return;
    animating = true;

    const to = JSON.parse(JSON.stringify(rawData[targetDay]));
    to.sort((a, b) => b.box - a.box);

    to.forEach((m, i) => {
        const row = rows[m.id];
        if (!row) return;
        row.style.transform = `translateY(${i * ROW_HEIGHT}px)`;

        // 🌟 确保高亮效果在移动过程中不丢失
        if (m.id === "grandma") {
            row.classList.add("row-highlight");
            row.querySelector(".bar").classList.add("bar-grandma");
            row.querySelector(".name").classList.add("grandma-name");
        }
    });

    let startTime = null;
    const duration = 10000;

    function animateStep(timestamp) {
        if (!startTime) startTime = timestamp;
        const elapsed = timestamp - startTime;
        const progress = Math.min(elapsed / duration, 1);

        to.forEach((m) => {
            const row = rows[m.id];
            if (!row) return;

            const from = currentData.find(x => x.id === m.id) || { box: 0, rate: 0, sched: 0, occ: 0 };

            const boxVal = from.box + (m.box - from.box) * progress;
            const rateVal = from.rate + (m.rate - from.rate) * progress;
            const schedVal = from.sched + (m.sched - from.sched) * progress;
            const occVal = from.occ + (m.occ - from.occ) * progress;

            const bar = row.querySelector(".bar");
            const boxText = row.querySelector(".value");
            const infoSpans = row.querySelectorAll(".info span");

            bar.style.width = rateVal + "%";
            bar.innerText = rateVal.toFixed(1) + "%";
            boxText.innerText = boxVal.toFixed(2) + "万";
            infoSpans[1].innerText = "排片：" + schedVal.toFixed(1) + "%";
            infoSpans[2].innerText = "上座率：" + occVal.toFixed(1) + "%";
        });

        if (progress < 1) {
            requestAnimationFrame(animateStep);
        } else {
            currentData = to;
            animating = false;
        }
    }

    requestAnimationFrame(animateStep);
}

function switchDay(day) {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    document.querySelector(`[onclick="switchDay('${day}')"]`).classList.add("active");
    animateTo(day);
}

init();
</script>
